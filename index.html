<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pharos</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0d10;
        color: #d7dade;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #status {
        position: fixed;
        top: 16px;
        left: 16px;
        max-width: calc(100vw - 32px);
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
      }
      #status[data-tone='error'] {
        background: rgba(170, 50, 50, 0.85);
        border-color: rgba(255, 200, 200, 0.3);
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="status" data-tone="info" role="status" aria-live="polite">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
